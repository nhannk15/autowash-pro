spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:autowashpro_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
  mail:
    host: localhost
    port: 2525

logging:
  level:
    org.springframework.security: WARN

jwt:
  secret-key: test-only-secret-key-that-is-long-enough-for-hs512-signing-1234567890

frontend:
  base-url: http://127.0.0.1:3000

email:
  sendbooking: no

vnpay:
  tmn-code: TEST
  hash-secret: test-vnpay-secret
  pay-url: http://127.0.0.1:9999/vnpay/pay
  return-url: http://127.0.0.1:8080/api/payment/vnpay/return
  ipn-url: http://127.0.0.1:8080/api/payment/vnpay/ipn
  version: 2.1.0
  command: pay
  curr-code: VND
  locale: vn
